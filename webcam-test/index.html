<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webcam Capture Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #1f2933;
      background: #f4f5f7;
    }

    main {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: 24px;
      border: 1px solid #c7cdd4;
      background: white;
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }

    .preview {
      display: grid;
      width: 100%;
      margin: 20px 0;
      aspect-ratio: 4 / 3;
      place-items: center;
      overflow: hidden;
      border: 1px solid #7b8794;
      background: #111820;
    }

    video,
    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    video {
      transform: scaleX(-1);
    }

    [hidden] {
      display: none !important;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid #52606d;
      border-radius: 4px;
      background: #eef1f4;
      color: #1f2933;
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #1769aa;
      outline-offset: 2px;
    }

    #status {
      min-height: 1.5em;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Webcam Capture Test</h1>
    <p>Allow camera access to test photograph capture.</p>

    <div class="preview">
      <video id="video" autoplay muted playsinline hidden></video>
      <img id="photo" alt="Captured photograph" hidden>
    </div>

    <div class="controls">
      <button id="enableCamera" type="button">Enable Camera</button>
      <button id="takePhoto" type="button" hidden>Take Photo</button>
      <button id="retake" type="button" hidden>Retake</button>
      <button id="deletePhoto" type="button" hidden>Delete Photo</button>
    </div>

    <p id="status" role="status" aria-live="polite">Camera is off.</p>
    <canvas id="canvas" hidden></canvas>
  </main>

  <script>
    const video = document.getElementById("video");
    const photo = document.getElementById("photo");
    const canvas = document.getElementById("canvas");
    const status = document.getElementById("status");
    const enableButton = document.getElementById("enableCamera");
    const takeButton = document.getElementById("takePhoto");
    const retakeButton = document.getElementById("retake");
    const deleteButton = document.getElementById("deletePhoto");

    let cameraStream = null;
    let photoBlob = null;
    let photoUrl = "";

    enableButton.addEventListener("click", enableCamera);
    takeButton.addEventListener("click", takePhoto);
    retakeButton.addEventListener("click", retakePhoto);
    deleteButton.addEventListener("click", deletePhoto);
    window.addEventListener("pagehide", cleanUp);
    window.addEventListener("beforeunload", cleanUp);

    async function enableCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("Camera access is not supported in this browser.");
        return;
      }

      setStatus("Requesting camera permission...");
      enableButton.disabled = true;

      try {
        stopCamera();
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "user" } },
          audio: false
        });

        video.srcObject = cameraStream;
        await video.play();
        video.hidden = false;
        photo.hidden = true;
        enableButton.hidden = true;
        takeButton.hidden = false;
        retakeButton.hidden = true;
        deleteButton.hidden = true;
        setStatus("Camera is ready.");
      } catch (error) {
        stopCamera();
        enableButton.hidden = false;
        setStatus(cameraErrorMessage(error));
      } finally {
        enableButton.disabled = false;
      }
    }

    function takePhoto() {
      if (!cameraStream || !video.videoWidth || !video.videoHeight) {
        setStatus("The camera is not ready yet.");
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const context = canvas.getContext("2d");

      context.translate(canvas.width, 0);
      context.scale(-1, 1);
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      context.setTransform(1, 0, 0, 1, 0, 0);

      canvas.toBlob((blob) => {
        if (!blob) {
          setStatus("The photograph could not be captured.");
          return;
        }

        clearPhoto();
        photoBlob = blob;
        photoUrl = URL.createObjectURL(photoBlob);
        photo.src = photoUrl;
        photo.hidden = false;
        video.hidden = true;
        takeButton.hidden = true;
        retakeButton.hidden = false;
        deleteButton.hidden = false;
        stopCamera();
        setStatus("Photograph captured temporarily in browser memory.");
      }, "image/jpeg", 0.9);
    }

    function retakePhoto() {
      clearPhoto();
      enableCamera();
    }

    function deletePhoto() {
      clearPhoto();
      stopCamera();
      photo.hidden = true;
      video.hidden = true;
      enableButton.hidden = false;
      takeButton.hidden = true;
      retakeButton.hidden = true;
      deleteButton.hidden = true;
      setStatus("Photograph deleted. Camera is off.");
    }

    function stopCamera() {
      cameraStream?.getTracks().forEach((track) => track.stop());
      cameraStream = null;
      video.srcObject = null;
    }

    function clearPhoto() {
      if (photoUrl) {
        URL.revokeObjectURL(photoUrl);
      }
      photoBlob = null;
      photoUrl = "";
      photo.removeAttribute("src");
    }

    function cleanUp() {
      stopCamera();
      clearPhoto();
    }

    function setStatus(message) {
      status.textContent = message;
    }

    function cameraErrorMessage(error) {
      if (error.name === "NotAllowedError") {
        return "Camera permission was denied.";
      }
      if (error.name === "NotFoundError") {
        return "No camera was found.";
      }
      if (error.name === "NotReadableError") {
        return "The camera is already in use or unavailable.";
      }
      return "The camera could not be started.";
    }
  </script>
</body>
</html>
